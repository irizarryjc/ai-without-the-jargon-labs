# Format as of November 2026; check https://docs.n8n.io/release-notes/ and re-pin periodically
# Local lab Docker Compose for Chapter 22 (n8n Community Edition)
# Bound strictly to 127.0.0.1 so the lab editor is never exposed on the network.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.49.5
    container_name: n8n-lab
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      - TZ=${GENERIC_TIMEZONE:-UTC}
      - N8N_HOST=localhost
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
